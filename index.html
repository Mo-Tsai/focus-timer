<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Focus Timer</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Focus Timer">
<meta name="theme-color" content="#19170F">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..440&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Focus Timer — warm-dark portrait UI
   Visual source of truth: focus-timer-mockup.html
   ============================================================ */
:root{
  --d0:#141209; --d1:#19170F; --d2:#211E15; --d3:#2A261B;
  --tx:#ECE7D9; --tx2:#9D9684; --tx3:#6E6857;
  --jade:#5DB89A; --jade-dim:#2E5A4D; --ember:#B98A57;
  --line:rgba(236,231,217,.10); --line2:rgba(236,231,217,.06);
  --sans:-apple-system,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--d1);
  color:var(--tx);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}

.app{
  position:relative;
  display:flex;
  flex-direction:column;
  height:100svh;
  max-width:440px;
  margin:0 auto;
  overflow:hidden;
}

/* -- Screen views: only one visible at a time -- */
.screen-view{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:calc(var(--sat) + 30px) 22px 0;
  overflow:hidden;
}
.screen-view[hidden]{display:none;}

/* -- App header (Setup) -- */
.apphdr{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:8px;
  margin-bottom:22px;
}
.apphdr .ttl{
  font-family:var(--serif);
  font-style:italic;
  font-size:16px;
  color:var(--tx);
  letter-spacing:.01em;
}
.apphdr .ver{
  margin-left:auto;
  font-family:'Courier New',monospace;
  font-size:10px;
  color:var(--tx3);
  letter-spacing:.06em;
}

/* -- Segmented mode toggle -- */
.seg{
  display:flex;
  background:var(--d2);
  border:1px solid var(--line);
  border-radius:11px;
  padding:3px;
  gap:3px;
}
.seg button{
  flex:1;
  border:0;
  background:transparent;
  color:var(--tx2);
  font-family:var(--sans);
  font-size:13px;
  padding:9px 0;
  border-radius:8px;
  letter-spacing:.04em;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.seg button b{font-weight:400;color:inherit;}
.seg .on{
  background:var(--d3);
  color:var(--tx);
  box-shadow:0 1px 0 rgba(236,231,217,.05) inset;
}
.seg .on b{color:var(--jade);font-weight:500;}

/* -- Time dial -- */
.dial{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.dial .time{
  font-family:var(--serif);
  font-weight:300;
  font-size:74px;
  letter-spacing:.01em;
  line-height:1;
  font-variant-numeric:tabular-nums;
  color:var(--tx);
  cursor:ns-resize;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  touch-action:none;
}
.dial .hint{
  font-size:11.5px;
  color:var(--tx3);
  letter-spacing:.02em;
}
.dial .hint .ar{color:var(--tx2);}

/* -- Wave chip -- */
.chip{
  align-self:center;
  display:inline-flex;
  align-items:center;
  gap:9px;
  background:var(--d2);
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 15px;
  font-size:12.5px;
  color:var(--tx2);
  margin-bottom:4px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.chip .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--jade);
  box-shadow:0 0 7px var(--jade);
}
.chip .ca{color:var(--tx3);margin-left:2px;}

/* -- Primary CTA -- */
.cta{
  margin-top:20px;
  margin-bottom:calc(var(--sab) + 20px);
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px 0;
  background:var(--jade);
  color:#0E1A15;
  font-family:var(--sans);
  font-weight:600;
  font-size:14.5px;
  letter-spacing:.12em;
  box-shadow:0 0 26px -6px rgba(93,184,154,.55);
  text-transform:uppercase;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s var(--ease);
}
.cta:active{transform:scale(.985);}
.cta.soft{text-transform:none;letter-spacing:.04em;font-size:15px;margin-bottom:0;}
.cta.ghost{
  background:transparent;color:var(--tx);
  border:1px solid var(--line);box-shadow:none;
  font-weight:500;text-transform:none;letter-spacing:.03em;font-size:14.5px;
  margin-bottom:0;
}

/* -- In-focus screen -- */
.focus-view{padding-bottom:0;}
.doing{
  font-size:12px;color:var(--tx2);letter-spacing:.03em;
  text-align:center;margin-top:6px;
}
.doing b{color:var(--tx);font-weight:500;}
.runwrap{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.bigtime{
  font-family:var(--serif);
  font-weight:300;
  font-size:80px;
  line-height:1;
  font-variant-numeric:tabular-nums;
  color:var(--tx);
  transition:color .4s var(--ease);
}
.bigtime.ending{color:var(--ember);}
.prog{width:190px;margin-top:26px;}
.track{
  position:relative;height:5px;border-radius:4px;
  background:var(--d2);overflow:hidden;
}
.warm{
  position:absolute;left:0;top:0;bottom:0;
  width:0;background:rgba(185,138,87,.22);
}
.fill{
  position:absolute;left:0;top:0;bottom:0;
  width:0;background:var(--jade);
  box-shadow:0 0 10px -1px var(--jade);
  transition:width .9s linear;
}
.proglab{
  display:flex;justify-content:space-between;
  margin-top:8px;font-size:10.5px;color:var(--tx3);letter-spacing:.04em;
}
.proglab .w{color:var(--ember);}
.distract{
  margin:0 0 14px;width:100%;
  border:0;border-radius:17px;padding:22px 0;
  background:var(--d2);
  border:1px solid rgba(185,138,87,.3);
  color:var(--tx);
  font-family:var(--sans);font-size:15px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .12s var(--ease),background .2s var(--ease);
}
.distract:active{transform:scale(.98);background:var(--d3);}
.stopline{
  text-align:center;
  padding-bottom:calc(var(--sab) + 20px);
  font-size:11.5px;color:var(--tx3);letter-spacing:.08em;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.countpill{
  position:absolute;
  top:calc(var(--sat) + 22px);
  right:22px;
  font-size:11px;color:var(--tx2);
  background:var(--d2);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px;z-index:6;
}
.countpill[hidden]{display:none;}

/* -- Log screen -- */
.log-title{
  font-family:var(--serif);font-style:italic;
  font-size:18px;color:var(--tx);margin:6px 0 16px;
}
.empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  gap:12px;padding-bottom:40px;color:var(--tx3);
}
.empty .glyph{font-size:30px;opacity:.5;}
.empty .big{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--tx2);}
.empty .sub{font-size:13px;line-height:1.55;max-width:240px;color:var(--tx3);}

/* -- Bottom tabs -- */
.tabs{
  display:flex;flex:none;
  border-top:1px solid var(--line);
  background:rgba(20,18,12,.6);
  padding-bottom:var(--sab);
}
.tabs button{
  flex:1;text-align:center;
  padding:14px 0 16px;
  font-size:11.5px;color:var(--tx3);letter-spacing:.08em;
  background:none;border:0;font-family:var(--sans);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.tabs .ic{display:block;font-size:15px;margin-bottom:4px;}
.tabs .on{color:var(--tx);}
.tabs .on .ic{color:var(--jade);}

/* -- Bottom sheets -- */
.sheet-wrap{position:absolute;inset:0;z-index:18;}
.sheet-wrap[hidden]{display:none;}
.scrim{position:absolute;inset:0;background:rgba(8,7,4,.62);}
.sheet{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--d3);
  border-top:1px solid var(--line);
  border-radius:22px 22px 0 0;
  padding:22px 22px calc(var(--sab) + 26px);
  box-shadow:0 -20px 40px -20px rgba(0,0,0,.6);
  animation:sheetUp .28s var(--ease);
}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.grab{
  width:38px;height:4px;border-radius:3px;
  background:rgba(236,231,217,.18);margin:0 auto 16px;
}
.sheet .lab{
  font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--jade);
}
.sheet h3{
  font-family:var(--serif);font-style:italic;font-weight:430;
  font-size:19px;color:var(--tx);margin-bottom:3px;
}

/* wave rows */
.wave-row{
  display:flex;align-items:center;gap:11px;width:100%;
  background:var(--d1);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin-top:10px;
  color:var(--tx2);font-family:var(--sans);font-size:14px;text-align:left;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.wave-row .dot{width:7px;height:7px;border-radius:50%;background:var(--tx3);flex:none;}
.wave-row .nm{color:var(--tx);font-weight:500;}
.wave-row .sub{color:var(--tx3);font-size:12px;}
.wave-row .rg{margin-left:auto;font-size:11px;color:var(--tx3);}
.wave-row.sel{
  border-color:rgba(93,184,154,.4);
  background:rgba(93,184,154,.08);
}
.wave-row.sel .dot{background:var(--jade);box-shadow:0 0 7px var(--jade);}
.wave-row.sel .nm{color:var(--jade);}

/* volume row inside sheet */
.vol-row{display:flex;align-items:center;gap:12px;margin-top:18px;}
.vol-row .vi{
  font-size:15px;color:var(--tx2);background:none;border:0;
  cursor:pointer;width:22px;text-align:center;line-height:1;
  -webkit-tap-highlight-color:transparent;
}
.vol-slider{
  flex:1;-webkit-appearance:none;appearance:none;
  height:3px;background:rgba(236,231,217,.14);border-radius:999px;outline:none;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--jade);cursor:pointer;
}
.vol-slider::-moz-range-thumb{
  width:15px;height:15px;border-radius:50%;background:var(--jade);border:0;cursor:pointer;
}
.vol-slider.muted{opacity:.35;}

::-webkit-scrollbar{width:0;}
</style>
</head>
<body>

<div class="app">

  <!-- distraction count, only during a running session -->
  <div class="countpill" id="countPill" hidden>0</div>

  <!-- ============ SCREEN 1 · SETUP ============ -->
  <section class="screen-view" id="screenSetup">
    <div class="apphdr">
      <span class="ttl">Focus</span>
      <svg width="46" height="14" viewBox="0 0 46 14" fill="none" aria-hidden="true">
        <path d="M2 12 L38 4" stroke="#5DB89A" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="40" cy="3.6" r="2.6" fill="#5DB89A"/>
      </svg>
      <span class="ver">v1.4</span>
    </div>

    <div class="seg">
      <button id="segFocus" class="on">&#9678; <b>Focus</b></button>
      <button id="segMed">&#9676; <b>Meditate</b></button>
    </div>

    <div class="dial">
      <div class="time" id="dialTime">25:00</div>
      <div class="hint"><span class="ar">&UpDownArrow;</span> drag or scroll to adjust</div>
    </div>

    <button class="chip" id="waveChip">
      <span class="dot"></span>
      <span id="chipText">Beta &middot; Focus &middot; 14&ndash;30 Hz</span>
      <span class="ca">&#9662;</span>
    </button>

    <button class="cta" id="btnStart">Start</button>
  </section>

  <!-- ============ SCREEN 3 · IN FOCUS ============ -->
  <section class="screen-view focus-view" id="screenFocus" hidden>
    <div class="doing">Working on: <b id="focusTask">&mdash;</b></div>
    <div class="runwrap">
      <div class="bigtime" id="bigTime">25:00</div>
      <div class="prog">
        <div class="track">
          <div class="warm" id="warmZone"></div>
          <div class="fill" id="progFill"></div>
        </div>
        <div class="proglab"><span class="w">Warm-up</span><span id="progEnd">25:00</span></div>
      </div>
    </div>
    <button class="distract" id="btnDistract">Distracted</button>
    <div class="stopline" id="holdPause">&#9208; Hold to pause</div>
  </section>

  <!-- ============ SCREEN 5 · LOG ============ -->
  <section class="screen-view" id="screenLog" hidden>
    <div class="log-title">Log &amp; Self-check</div>
    <div class="empty" id="logEmpty">
      <div class="glyph">&#9678;</div>
      <div class="big">No sessions yet.</div>
      <div class="sub">Finish your first focus block and your completion rate, distractions, and focus minutes will appear here.</div>
    </div>
  </section>

  <!-- ============ BOTTOM TABS ============ -->
  <nav class="tabs">
    <button id="tabFocus" class="on"><span class="ic">&#9678;</span>Focus</button>
    <button id="tabLog"><span class="ic">&#9636;</span>Log</button>
  </nav>

  <!-- ============ WAVE PICKER SHEET ============ -->
  <div class="sheet-wrap" id="waveSheet" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet">
      <div class="grab"></div>
      <div class="lab">Sound</div>
      <h3>Choose your wave.</h3>
      <div id="waveRows"></div>
      <div class="vol-row">
        <button class="vi" id="muteBtn" aria-label="Mute">&#128266;</button>
        <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="33" aria-label="Volume">
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   Focus Timer v2
   - Preserved engine: binaural audio + countdown tick (v1.3)
   - New modules: Store, screen router, session lifecycle
   ============================================================ */
(function () {
  'use strict';

  /* ---------- Wave definitions (audio engine — preserved) ---------- */
  const WAVES = {
    theta:   { carrier:200, beat:6,  nm:'Theta', sub:'Deep',      rg:'4–7 Hz',   desc:'Deep meditation & creativity' },
    alpha:   { carrier:200, beat:10, nm:'Alpha', sub:'Relax',     rg:'8–13 Hz',  desc:'Relaxed alertness & calm' },
    beta:    { carrier:200, beat:20, nm:'Beta',  sub:'Focus',     rg:'14–30 Hz', desc:'Active focus & concentration' },
    detox95: { carrier:200, beat:95, nm:'Detox', sub:'Mold Test', rg:'95 Hz',    desc:'High Gamma · mold resonance test' },
  };
  const WAVE_ORDER = ['theta','alpha','beta','detox95'];

  /* ---------- Store module (localStorage, per spec) ---------- */
  const Store = {
    KEY_SESSIONS: 'ft.sessions',
    KEY_SETTINGS: 'ft.settings',
    sessions() {
      try { return JSON.parse(localStorage.getItem(this.KEY_SESSIONS)) || []; }
      catch (e) { return []; }
    },
    addSession(o) {
      const a = this.sessions();
      a.push(o);
      try { localStorage.setItem(this.KEY_SESSIONS, JSON.stringify(a)); } catch (e) {}
    },
    settings() {
      const def = { defaultMode:'focus', defaultWave:'beta', defaultPlannedSec:1500, warmupSec:900, vol:33 };
      try { return Object.assign(def, JSON.parse(localStorage.getItem(this.KEY_SETTINGS)) || {}); }
      catch (e) { return def; }
    },
    saveSettings(s) {
      try { localStorage.setItem(this.KEY_SETTINGS, JSON.stringify(s)); } catch (e) {}
    },
  };

  /* ---------- Runtime state ---------- */
  let isMedMode   = false;
  let timerMin    = 25;
  let warmupSec   = 900;
  let isRunning   = false;
  let paused      = false;
  let remaining   = 0;
  let totalPhaseTime = 0;
  let intervalId  = null;
  let muted       = false;
  let waveVolume  = 0.04;
  let currentWave = 'beta';
  let activeTab   = 'focus';
  let cur         = null;   // current session object

  /* audio nodes */
  let audioCtx = null, oscLeft = null, oscRight = null, gainNode = null;
  let wakeLock = null;

  /* ---------- Elements ---------- */
  const $ = function (id) { return document.getElementById(id); };
  const screenSetup = $('screenSetup');
  const screenFocus = $('screenFocus');
  const screenLog   = $('screenLog');
  const segFocus = $('segFocus'), segMed = $('segMed');
  const dialTime = $('dialTime');
  const chipText = $('chipText'), waveChip = $('waveChip');
  const btnStart = $('btnStart');
  const focusTask = $('focusTask'), bigTime = $('bigTime');
  const warmZone = $('warmZone'), progFill = $('progFill'), progEnd = $('progEnd');
  const btnDistract = $('btnDistract'), holdPause = $('holdPause');
  const countPill = $('countPill');
  const tabFocus = $('tabFocus'), tabLog = $('tabLog');
  const waveSheet = $('waveSheet'), waveRows = $('waveRows');
  const volSlider = $('volSlider'), muteBtn = $('muteBtn');

  /* ---------- Helpers ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(sec) { return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60); }
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function clampMin(v) { return Math.max(1, Math.min(180, v)); }

  /* ---------- Settings persistence ---------- */
  function persistSettings() {
    Store.saveSettings({
      defaultMode: isMedMode ? 'meditate' : 'focus',
      defaultWave: currentWave,
      defaultPlannedSec: timerMin * 60,
      warmupSec: warmupSec,
      vol: parseInt(volSlider.value, 10),
    });
  }

  /* ---------- Audio engine (preserved from v1.3) ---------- */
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function startWaves() {
    initAudio();
    stopWaves();
    const w = WAVES[currentWave];
    gainNode = audioCtx.createGain();
    gainNode.gain.value = muted ? 0 : waveVolume;

    const merger = audioCtx.createChannelMerger(2);
    merger.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscLeft = audioCtx.createOscillator();
    oscLeft.type = 'sine';
    oscLeft.frequency.value = w.carrier;

    oscRight = audioCtx.createOscillator();
    oscRight.type = 'sine';
    oscRight.frequency.value = w.carrier + w.beat;

    const panL = audioCtx.createStereoPanner(); panL.pan.value = -1;
    const panR = audioCtx.createStereoPanner(); panR.pan.value = 1;

    oscLeft.connect(panL).connect(merger, 0, 0);
    oscRight.connect(panR).connect(merger, 0, 1);

    oscLeft.start();
    oscRight.start();
  }

  function stopWaves() {
    if (oscLeft)  { try { oscLeft.stop(); }  catch (e) {} oscLeft = null; }
    if (oscRight) { try { oscRight.stop(); } catch (e) {} oscRight = null; }
    gainNode = null;
  }

  function playNotification() {
    initAudio();
    const ctx = audioCtx, now = ctx.currentTime;
    [660, 880].forEach(function (freq, i) {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = freq;
      const t = now + i * 0.3;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.25, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
      osc.start(t); osc.stop(t + 1.2);
    });
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  /* ---------- Wake lock ---------- */
  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  }

  /* ---------- Volume ---------- */
  function updateVolIcon() {
    const v = parseInt(volSlider.value, 10);
    if (muted || v === 0)      muteBtn.innerHTML = '&#128264;';
    else if (v < 40)           muteBtn.innerHTML = '&#128265;';
    else                       muteBtn.innerHTML = '&#128266;';
    volSlider.classList.toggle('muted', muted);
  }
  volSlider.addEventListener('input', function () {
    waveVolume = (this.value / 100) * 0.12;
    if (gainNode && !muted) gainNode.gain.setTargetAtTime(waveVolume, audioCtx.currentTime, 0.05);
    updateVolIcon();
    persistSettings();
  });
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
    if (gainNode) gainNode.gain.setTargetAtTime(muted ? 0 : waveVolume, audioCtx.currentTime, 0.05);
    updateVolIcon();
  });

  /* ---------- Screen router ---------- */
  function render() {
    const onFocus = activeTab === 'focus';
    screenSetup.hidden = !(onFocus && !isRunning);
    screenFocus.hidden = !(onFocus && isRunning);
    screenLog.hidden   = !(activeTab === 'log');
    countPill.hidden   = !(onFocus && isRunning && cur && cur.distractions > 0);
    tabFocus.classList.toggle('on', onFocus);
    tabLog.classList.toggle('on', activeTab === 'log');
  }
  tabFocus.addEventListener('click', function () { activeTab = 'focus'; render(); });
  tabLog.addEventListener('click', function () { activeTab = 'log'; render(); });

  /* ---------- Mode toggle ---------- */
  function setMode(med) {
    if (isRunning) return;
    isMedMode = med;
    segFocus.classList.toggle('on', !med);
    segMed.classList.toggle('on', med);
    persistSettings();
  }
  segFocus.addEventListener('click', function () { setMode(false); });
  segMed.addEventListener('click', function () { setMode(true); });

  /* ---------- Dial display + drag/scroll ---------- */
  function updateDialDisp() { dialTime.textContent = pad(timerMin) + ':00'; }

  let dragStartY = null, dragBase = null;
  const STEP_PX = 8, STEP_TOUCH = 7;

  dialTime.addEventListener('wheel', function (e) {
    if (isRunning) return;
    e.preventDefault();
    timerMin = clampMin(timerMin + (e.deltaY > 0 ? -1 : 1));
    updateDialDisp(); persistSettings();
  }, { passive: false });

  dialTime.addEventListener('mousedown', function (e) {
    if (isRunning) return;
    dragStartY = e.clientY; dragBase = timerMin;
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  });
  function onMouseMove(e) {
    timerMin = clampMin(dragBase + Math.round((dragStartY - e.clientY) / STEP_PX));
    updateDialDisp();
  }
  function onMouseUp() {
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
    persistSettings();
  }
  dialTime.addEventListener('touchstart', function (e) {
    if (isRunning) return;
    dragStartY = e.touches[0].clientY; dragBase = timerMin;
  }, { passive: true });
  dialTime.addEventListener('touchmove', function (e) {
    if (isRunning) return;
    timerMin = clampMin(dragBase + Math.round((dragStartY - e.touches[0].clientY) / STEP_TOUCH));
    updateDialDisp();
  }, { passive: true });
  dialTime.addEventListener('touchend', function () { persistSettings(); }, { passive: true });

  /* ---------- Wave picker ---------- */
  function updateChip() {
    const w = WAVES[currentWave];
    chipText.innerHTML = w.nm + ' &middot; ' + w.sub + ' &middot; ' + w.rg;
  }
  function buildWaveRows() {
    waveRows.innerHTML = '';
    WAVE_ORDER.forEach(function (id) {
      const w = WAVES[id];
      const b = document.createElement('button');
      b.className = 'wave-row' + (id === currentWave ? ' sel' : '');
      b.dataset.wave = id;
      b.innerHTML =
        '<span class="dot"></span>' +
        '<span class="nm">' + w.nm + '</span>' +
        '<span class="sub">' + w.sub + '</span>' +
        '<span class="rg">' + w.rg + '</span>';
      b.addEventListener('click', function () { selectWave(id); closeSheet(waveSheet); });
      waveRows.appendChild(b);
    });
  }
  function selectWave(id) {
    currentWave = id;
    updateChip();
    buildWaveRows();
    if (isRunning && !muted) startWaves();  // live swap while running
    persistSettings();
  }
  waveChip.addEventListener('click', function () { if (!isRunning) openSheet(waveSheet); });

  /* ---------- Sheets ---------- */
  function openSheet(el) { el.hidden = false; }
  function closeSheet(el) { el.hidden = true; }
  document.querySelectorAll('[data-close]').forEach(function (el) {
    el.addEventListener('click', function () { closeSheet(el.closest('.sheet-wrap')); });
  });

  /* ---------- Session lifecycle ---------- */
  function startSession(task) {
    cur = {
      id: 's_' + Date.now(),
      date: todayStr(),
      mode: isMedMode ? 'meditate' : 'focus',
      wave: currentWave,
      plannedSec: timerMin * 60,
      actualSec: 0,
      completed: false,
      task: task || '',
      distractions: 0,
      returns: [],
      selfRating: null,
      startedAt: new Date().toISOString(),
      endedAt: null,
    };
    startTimer();
  }

  function startTimer() {
    remaining = timerMin * 60;
    totalPhaseTime = remaining;
    isRunning = true;
    paused = false;
    activeTab = 'focus';

    focusTask.textContent = cur.task || (isMedMode ? 'Meditation' : 'Focus session');
    holdPause.innerHTML = '&#9208; Hold to pause';
    countPill.textContent = '0';

    render();
    updateRun();
    requestWakeLock();
    if (!muted) startWaves();
    intervalId = setInterval(tick, 1000);
  }

  function tick() {
    if (remaining <= 0) { onPhaseEnd(); return; }
    remaining--;
    cur.actualSec++;
    updateRun();
  }

  function updateRun() {
    bigTime.textContent = fmt(remaining);
    const planned = totalPhaseTime || 1;
    const elapsed = planned - remaining;
    progFill.style.width = (elapsed / planned * 100) + '%';
    warmZone.style.width = (Math.min(warmupSec, planned) / planned * 100) + '%';
    progEnd.textContent = fmt(planned);
    bigTime.classList.toggle('ending', remaining <= 10 && remaining > 0);
  }

  function pauseTimer() {
    if (!isRunning || paused) return;
    clearInterval(intervalId); intervalId = null;
    paused = true;
    holdPause.textContent = 'Paused · tap to resume';
  }
  function resumeTimer() {
    if (!isRunning || !paused) return;
    paused = false;
    holdPause.innerHTML = '&#9208; Hold to pause';
    intervalId = setInterval(tick, 1000);
  }

  function endSession() {
    if (!isRunning) return;
    cur.completed = remaining <= 0;
    cur.endedAt = new Date().toISOString();
    // NOTE: persistence to ft.sessions lands in commit 4 (Return sheet / End session)
    stopRun();
  }

  function onPhaseEnd() {
    clearInterval(intervalId); intervalId = null;
    cur.completed = true;
    cur.endedAt = new Date().toISOString();
    playNotification();
    // NOTE: persistence lands in commit 4
    stopRun();
  }

  function stopRun() {
    clearInterval(intervalId); intervalId = null;
    isRunning = false;
    paused = false;
    totalPhaseTime = 0;
    stopWaves();
    releaseWakeLock();
    cur = null;
    activeTab = 'focus';
    updateDialDisp();
    render();
  }

  /* ---------- Start button (commit 1: direct start; Begin sheet in commit 2) ---------- */
  btnStart.addEventListener('click', function () { startSession(''); });

  /* ---------- Distracted (commit 1: silent +1; Return sheet in commit 4) ---------- */
  btnDistract.addEventListener('click', function () {
    if (!isRunning) return;
    cur.distractions++;
    countPill.textContent = cur.distractions;
    countPill.hidden = false;
  });

  /* ---------- Hold to pause / tap to resume ---------- */
  let holdTimer = null, didHoldPause = false;
  holdPause.addEventListener('pointerdown', function () {
    if (!isRunning) return;
    if (paused) return;
    didHoldPause = false;
    holdTimer = setTimeout(function () { pauseTimer(); didHoldPause = true; }, 450);
  });
  function endHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (didHoldPause) { didHoldPause = false; return; }
    if (paused) resumeTimer();
  }
  holdPause.addEventListener('pointerup', endHold);
  holdPause.addEventListener('pointerleave', function () {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  });

  /* ---------- Init ---------- */
  (function init() {
    const s = Store.settings();
    isMedMode   = s.defaultMode === 'meditate';
    currentWave = WAVES[s.defaultWave] ? s.defaultWave : 'beta';
    timerMin    = clampMin(Math.round((s.defaultPlannedSec || 1500) / 60));
    warmupSec   = s.warmupSec || 900;
    volSlider.value = (s.vol != null ? s.vol : 33);
    waveVolume  = (volSlider.value / 100) * 0.12;

    segFocus.classList.toggle('on', !isMedMode);
    segMed.classList.toggle('on', isMedMode);

    updateDialDisp();
    updateChip();
    buildWaveRows();
    updateVolIcon();
    render();
  })();

})();
</script>
</body>
</html>
