<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Timer</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Focus Timer">
<meta name="theme-color" content="#0a0a0c">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0a0a0c;
  --surface: rgba(255,255,255,0.03);
  --ring: rgba(255,255,255,0.05);
  --ring-outer: rgba(255,255,255,0.10);
  --text: rgba(255,255,255,0.92);
  --muted: rgba(255,255,255,0.42);
  --dim: rgba(255,255,255,0.28);
  --divider: rgba(255,255,255,0.07);
  --accent: #5b9cf6;
  --accent-rgb: 91,156,246;
  --alpha: #a78bfa;
  --alpha-rgb: 167,139,250;
  --theta: #34d399;
  --theta-rgb: 52,211,153;
  --red: rgba(220,70,55,0.9);
  --red-bg: rgba(220,70,55,0.09);
  --red-ring: rgba(220,70,55,0.35);
  --ease: cubic-bezier(0.16,1,0.3,1);
  --ease-fast: cubic-bezier(0.16,1,0.3,1);
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-weight: 550;
  font-feature-settings: 'ss02' 0;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

body { transition: background 0.6s var(--ease); }
body.cf { background: radial-gradient(ellipse at 60% 20%, rgba(91,156,246,0.06) 0%, #0a0a0c 65%); }
body.cm { background: radial-gradient(ellipse at 50% 50%, rgba(167,139,250,0.06) 0%, #0a0a0c 65%); }

.app {
  height: 100svh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 12px 24px;
  max-width: 440px;
  margin: 0 auto;
  gap: 0;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

/* -- Header -- */
.header {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 8px;
  transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
}
.app-title {
  font-size: 17px;
  font-weight: 680;
  letter-spacing: -0.03em;
  color: var(--text);
}
.app-subtitle {
  font-size: 13px;
  font-weight: 450;
  color: var(--muted);
  letter-spacing: -0.01em;
}
.streak-badge {
  margin-left: auto;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.01em;
  white-space: nowrap;
  display: none;
}

/* -- Eyebrow -- */
.eyebrow {
  font-family: 'Courier New', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--dim);
  line-height: 1.4;
  margin-bottom: 8px;
}

/* -- Tabs -- */
.tabs {
  display: flex;
  border-radius: 16px;
  padding: 4px;
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--ring);
  margin-bottom: 10px;
  transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
}
.tab {
  flex: 1;
  border-radius: 12px;
  min-height: 34px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 14px;
  font-weight: 550;
  cursor: pointer;
  transition: all 0.22s var(--ease);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.tab:active { transform: scale(0.97); }
.tab.on {
  background: rgba(255,255,255,0.09);
  color: var(--text);
  box-shadow: 0 1px 4px rgba(0,0,0,0.5), 0 0 0 1px var(--ring-outer);
}
.tab-icon {
  font-size: 15px;
  line-height: 1;
}

/* -- Timer section -- */
.timer-section {
  margin-bottom: 6px;
  transition: all 0.5s var(--ease);
}

/* -- Circle timer container -- */
.timer-section.immersive {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-bottom: 0;
  flex: 1;
}

.circle-timer {
  position: relative;
}

/* Idle: no size, inner flows normally */
.timer-section:not(.immersive) .circle-timer {
  width: auto;
  height: auto;
}
.timer-section:not(.immersive) .circle-svg {
  display: none;
}
.timer-section:not(.immersive) .circle-wave-info,
.timer-section:not(.immersive) .circle-phase {
  display: none;
}

/* Immersive: sized circle with centered content */
.timer-section.immersive .circle-timer {
  width: 240px;
  height: 240px;
}
.timer-section.immersive .circle-inner {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.timer-section.immersive .scroll-hint,
.timer-section.immersive .eyebrow {
  display: none;
}

/* SVG ring */
.circle-svg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  transform: rotate(-90deg);
}
.circle-bg {
  fill: none;
  stroke: rgba(255,255,255,0.04);
  stroke-width: 3;
}
.circle-fg {
  fill: none;
  stroke: var(--accent);
  stroke-width: 3;
  stroke-linecap: round;
  transition: stroke 0.5s var(--ease);
}

/* Wave info above timer in circle */
.circle-wave-info {
  font-family: 'Courier New', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.10em;
  color: var(--dim);
  margin-bottom: 4px;
}

/* Phase label below timer in circle */
.circle-phase {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.02em;
  white-space: nowrap;
  text-align: center;
  margin-top: 4px;
}


.t-num-wrap {
  position: relative;
  display: inline-block;
  cursor: ns-resize;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  touch-action: none;
  margin-bottom: 2px;
}
.t-num {
  font-size: clamp(48px, 14vw, 72px);
  font-weight: 220;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  line-height: 1;
  transition: color 0.5s var(--ease);
}
.t-num.hl { color: var(--accent); }
.t-colon {
  opacity: 0.55;
}

/* old flat progress arc - hidden now, replaced by circle */
.progress-arc-wrap { display: none; }

.scroll-hint {
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 0.04em;
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: opacity 0.4s var(--ease);
}
.scroll-hint-arrow {
  font-size: 13px;
  opacity: 0.55;
}


/* -- Divider -- */
.divider {
  height: 1px;
  background: var(--divider);
  margin: 6px 0;
  transition: opacity 0.4s var(--ease);
}

/* -- Collapsible panels (fade out when running) -- */
.collapsible {
  transition: opacity 0.5s var(--ease), max-height 0.5s var(--ease), margin 0.4s var(--ease), transform 0.5s var(--ease);
  overflow: hidden;
  max-height: 500px;
  opacity: 1;
  transform: translateY(0);
}
.collapsible.hidden {
  opacity: 0;
  max-height: 0;
  margin: 0;
  transform: translateY(-8px);
  pointer-events: none;
}

/* -- Status row -- */
.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  transition: opacity 0.4s var(--ease);
}
.phase-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.phase-pip {
  width: 7px;
  height: 7px;
  border-radius: 9999px;
  background: var(--accent);
  flex-shrink: 0;
  display: none;
  box-shadow: 0 0 6px currentColor;
  transition: background 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.phase-pip.visible {
  display: block;
}
.phase-txt {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.01em;
}
.rounds-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.rounds-eyebrow {
  font-family: 'Courier New', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--dim);
}
.rounds-val {
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}

/* -- Daily stats -- */
.daily-stats {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.01em;
}
.daily-stats .eyebrow {
  margin-bottom: 4px;
}

/* -- Wave section -- */
.wave-section {
  margin-bottom: 0;
}
.wave-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 6px;
}
.wb {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 8px 10px 6px;
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--ring);
  border-radius: 14px;
  border: none;
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 550;
  cursor: pointer;
  transition: all 0.22s var(--ease);
  text-align: left;
  min-height: 38px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.wb:active { transform: scale(0.97); }
.wb-label {
  font-family: 'Courier New', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.10em;
  margin-bottom: 4px;
  opacity: 0.65;
}
.wb-name {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.wb-hz {
  font-size: 10px;
  margin-top: 2px;
  opacity: 0.6;
}
.wb.on.beta {
  background: rgba(var(--accent-rgb),0.1);
  box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb),0.25), 0 0 0 1px rgba(var(--accent-rgb),0.10);
  color: var(--accent);
}
.wb.on.alpha {
  background: rgba(var(--alpha-rgb),0.1);
  box-shadow: inset 0 0 0 1px rgba(var(--alpha-rgb),0.25), 0 0 0 1px rgba(var(--alpha-rgb),0.10);
  color: var(--alpha);
}
.wb.on.theta {
  background: rgba(var(--theta-rgb),0.1);
  box-shadow: inset 0 0 0 1px rgba(var(--theta-rgb),0.25), 0 0 0 1px rgba(var(--theta-rgb),0.10);
  color: var(--theta);
}
.wave-status {
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 20px;
}
.wave-dot {
  width: 6px;
  height: 6px;
  border-radius: 9999px;
  background: var(--dim);
  flex-shrink: 0;
  transition: background 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.wave-dot.active {
  background: var(--accent);
  box-shadow: 0 0 5px var(--accent);
}
#waveTxt {
  font-size: 12px;
  color: var(--dim);
  letter-spacing: 0.01em;
}

/* -- Ambient section -- */
.ambient-section {
  margin-bottom: 0;
}
.ambient-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 0;
}
.ab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px 4px;
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--ring);
  border-radius: 14px;
  border: none;
  color: var(--muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 550;
  cursor: pointer;
  transition: all 0.22s var(--ease);
  text-align: center;
  min-height: 36px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.ab:active { transform: scale(0.97); }
.ab.on {
  background: rgba(255,255,255,0.09);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), 0 0 0 1px rgba(255,255,255,0.08);
  color: var(--text);
}

/* -- Controls -- */
.controls {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 6px;
  transition: opacity 0.4s var(--ease);
}
.controls-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
}
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 0 24px;
  height: calc(2.4em);
  min-height: 38px;
  border-radius: 9999px;
  border: none;
  background: rgba(255,255,255,0.05);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  color: var(--muted);
  font-family: inherit;
  font-size: 14px;
  font-weight: 550;
  cursor: pointer;
  transition: all 0.18s var(--ease-fast);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn:hover:not(:active) {
  background: rgba(255,255,255,0.07);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
  color: var(--text);
}

.btn-mute {
  width: 44px;
  padding: 0;
  flex-shrink: 0;
  font-size: 17px;
}

.btn-start {
  flex: 1;
  background: rgba(255,255,255,0.93);
  color: #0a0a0c;
  font-weight: 650;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.12),
    0 4px 20px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.35);
}
.btn-start:hover:not(:active) {
  background: rgba(255,255,255,0.98);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.18),
    0 6px 24px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.5);
  color: #0a0a0c;
}


/* Stop link - minimal text button, only visible when running */
.btn-stop-link {
  display: none;
  background: none;
  border: none;
  color: var(--dim);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.02em;
  cursor: pointer;
  padding: 4px 0;
  text-align: center;
  transition: color 0.18s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.btn-stop-link:hover { color: var(--muted); }
.btn-stop-link.visible { display: block; }

/* -- Breathing animation (meditate mode) -- */
.breathing-ring {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 180px;
  height: 180px;
  border-radius: 9999px;
  background: transparent;
  box-shadow:
    0 0 0 1px rgba(167,139,250,0.15),
    0 0 60px rgba(167,139,250,0.08);
  pointer-events: none;
  z-index: 0;
}
.breathing-ring.active {
  display: block;
  animation: breathe 8s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
  50% { transform: translate(-50%, -50%) scale(1.35); opacity: 0.9; }
}

/* -- Running mode pulse -- */
@keyframes timerPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.75; }
}

/* scrollbar for webkit */
::-webkit-scrollbar { width: 0; }

</style>
</head>
<body>

<div class="breathing-ring" id="breathingRing"></div>

<div class="app">

  <!-- Header -->
  <div class="header collapsible" id="headerEl">
    <span class="app-title">Focus Timer</span>
    <span class="app-subtitle">binaural beats + pomodoro</span>
    <span class="streak-badge" id="streakBadge"></span>
  </div>

  <!-- Tabs -->
  <div class="tabs collapsible" id="tabsEl" role="tablist">
    <button class="tab on" id="tabFocus" role="tab" aria-selected="true" aria-controls="focusPanel">
      <span class="tab-icon">&#9678;</span> Focus
    </button>
    <button class="tab" id="tabMed" role="tab" aria-selected="false" aria-controls="meditatePanel">
      <span class="tab-icon">&#9676;</span> Meditate
    </button>
  </div>

  <!-- Timer section -->
  <div class="timer-section" id="timerSection">
    <div class="eyebrow" id="timerEyebrow">Work Duration</div>

    <!-- Circle container: always present, SVG only visible when running -->
    <div class="circle-timer" id="circleTimer">
      <svg class="circle-svg" viewBox="0 0 240 240">
        <circle class="circle-bg" cx="120" cy="120" r="108" />
        <circle class="circle-fg" id="circleFg" cx="120" cy="120" r="108" stroke-dasharray="0 678.58" />
      </svg>
      <div class="circle-inner">
        <div class="circle-wave-info" id="circleWaveInfo"></div>
        <div class="t-num-wrap" id="mainTrack" aria-label="Timer: drag up/down to set minutes">
          <div class="t-num" id="dispNum">25<span class="t-colon">:</span>00</div>
        </div>
        <div class="circle-phase" id="circlePhase"></div>
      </div>
    </div>

    <div class="scroll-hint" id="hint">
      <span class="scroll-hint-arrow">&UpDownArrow;</span>
      <span>drag or scroll to adjust</span>
    </div>

  </div>

  <!-- Divider -->
  <div class="divider collapsible" id="div1"></div>

  <!-- Status row -->
  <div class="status-row collapsible" id="statusRow">
    <div class="phase-wrap" id="phaseEl">
      <span class="phase-pip" id="phasePip"></span>
      <span class="phase-txt" id="phaseTxt">Ready</span>
    </div>
    <div class="rounds-wrap">
      <span class="rounds-eyebrow">Rounds</span>
      <span class="rounds-val" id="rndEl">0 rnd &middot; 0 pts</span>
    </div>
  </div>

  <!-- Divider -->
  <div class="divider collapsible" id="div2"></div>

  <!-- Daily stats -->
  <div class="daily-stats collapsible" id="dailyStats">
    <span class="phase-txt" id="dailyTxt"></span>
  </div>

  <!-- Divider -->
  <div class="divider collapsible" id="div3"></div>

  <!-- Wave section -->
  <div class="wave-section collapsible" id="waveSection">
    <div class="eyebrow">Binaural Waves</div>
    <div class="wave-grid">
      <button class="wb beta on" id="waveB" aria-pressed="true">
        <span class="wb-label">Beta</span>
        <span class="wb-name">Focus</span>
        <span class="wb-hz">14&ndash;30 Hz</span>
      </button>
      <button class="wb alpha" id="waveA" aria-pressed="false">
        <span class="wb-label">Alpha</span>
        <span class="wb-name">Relax</span>
        <span class="wb-hz">8&ndash;13 Hz</span>
      </button>
      <button class="wb theta" id="waveTheta" aria-pressed="false">
        <span class="wb-label">Theta</span>
        <span class="wb-name">Deep</span>
        <span class="wb-hz">4&ndash;7 Hz</span>
      </button>
    </div>
    <div class="wave-status" style="display:none">
      <span class="wave-dot" id="waveDot"></span>
      <span id="waveTxt">Waves off</span>
    </div>
  </div>

  <div class="ambient-section collapsible" id="ambientSection">
    <div class="eyebrow">Ambient Sound</div>
    <div class="ambient-grid">
      <button class="ab on" id="ambOff">Off</button>
      <button class="ab" id="ambForest">Forest</button>
      <button class="ab" id="ambRain">Rain</button>
      <button class="ab" id="ambOcean">Ocean</button>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls" id="controlsEl">
    <div class="controls-row">
      <button class="btn btn-mute" id="muteBtn" aria-label="Mute/unmute">&#128276;</button>
      <button class="btn btn-start" id="btnStart">Start</button>
    </div>
    <button class="btn-stop-link" id="btnStop">Reset</button>
  </div>

</div>

<script>
(function () {
  'use strict';

  // -- State --
  let isMedMode = false;
  let timerMin = 25;
  let isRunning = false;
  let remaining = 0;
  let totalPhaseTime = 0;
  let intervalId = null;
  let rounds = 0;
  let pts = 0;
  let muted = false;
  let currentWave = 'beta';
  let currentAmbient = 'off';
  let audioCtx = null;
  let oscLeft = null, oscRight = null, gainNode = null;
  let ambientSource = null, ambientGain = null;
  let wakeLock = null;
  // (single-button design: Start ↔ Pause toggle, separate stop link)

  const WAVES = {
    beta:  { carrier: 200, beat: 20,  name: 'Beta \u00b7 20 Hz \u00b7 Focus' },
    alpha: { carrier: 200, beat: 10,  name: 'Alpha \u00b7 10 Hz \u00b7 Relax' },
    theta: { carrier: 200, beat: 6,   name: 'Theta \u00b7 6 Hz \u00b7 Deep' }
  };

  // -- Ambient Sound generators --
  // Helper: create a long noise buffer (5s) to avoid audible loop seams
  function makeNoiseBuffer(ctx, seconds) {
    var len = ctx.sampleRate * seconds;
    var buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var data = buf.getChannelData(ch);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    return buf;
  }

  // Helper: create brown noise buffer with crossfade loop
  function makeBrownBuffer(ctx, seconds) {
    var len = ctx.sampleRate * seconds;
    var buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var data = buf.getChannelData(ch);
      var last = 0;
      // Use smaller step for smoother brown noise
      for (var i = 0; i < len; i++) {
        var white = Math.random() * 2 - 1;
        data[i] = last = (last + 0.01 * white) / 1.01;
      }
      // Normalize gently (don't push to full range)
      var max = 0;
      for (var i = 0; i < len; i++) { if (Math.abs(data[i]) > max) max = Math.abs(data[i]); }
      if (max > 0) {
        var scale = 0.7 / max;
        for (var i = 0; i < len; i++) data[i] *= scale;
      }
      // Crossfade last 0.5s with first 0.5s to eliminate loop click
      var fade = Math.floor(ctx.sampleRate * 0.5);
      for (var i = 0; i < fade; i++) {
        var t = i / fade;
        data[len - fade + i] = data[len - fade + i] * (1 - t) + data[i] * t;
      }
    }
    return buf;
  }

  function makeBufferSource(ctx, buf) {
    var src = ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    return src;
  }

  // Rain: white noise shaped to sound like steady rain
  // Key: keep some mid-high frequencies for the "shhh" texture
  function makeRain(ctx) {
    var src = makeBufferSource(ctx, makeNoiseBuffer(ctx, 5));
    // Gentle rolloff at top end, but keep 200-2000 Hz range alive
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 2500;
    lp.Q.value = 0.3;
    // Cut sub-bass rumble
    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 150;
    hp.Q.value = 0.3;
    src.connect(hp);
    hp.connect(lp);
    return { source: src, output: lp };
  }

  // Forest: pink-ish noise (nature-like spectrum) + subtle texture
  function makeForest(ctx) {
    var src1 = makeBufferSource(ctx, makeNoiseBuffer(ctx, 5));
    // Pink noise approximation: -3dB/octave via cascaded filters
    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 100;
    hp.Q.value = 0.3;
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 3000;
    lp.Q.value = 0.3;
    // Shelf to tilt spectrum: boost lows, reduce highs
    var shelf = ctx.createBiquadFilter();
    shelf.type = 'lowshelf';
    shelf.frequency.value = 500;
    shelf.gain.value = 6;
    src1.connect(hp);
    hp.connect(shelf);
    shelf.connect(lp);

    // Quiet high-freq layer for "life" texture
    var src2 = makeBufferSource(ctx, makeNoiseBuffer(ctx, 5));
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 5000;
    bp.Q.value = 0.3;
    var g2 = ctx.createGain();
    g2.gain.value = 0.04;
    src2.connect(bp);
    bp.connect(g2);

    var mix = ctx.createGain();
    mix.gain.value = 1;
    lp.connect(mix);
    g2.connect(mix);

    var origStart = src1.start.bind(src1);
    src1.start = function() { origStart(); src2.start(); };
    var origStop = src1.stop.bind(src1);
    src1.stop = function() { origStop(); try { src2.stop(); } catch(e){} };

    return { source: src1, output: mix };
  }

  // Ocean: filtered noise with slow wave-like volume modulation
  function makeOcean(ctx) {
    var src = makeBufferSource(ctx, makeNoiseBuffer(ctx, 5));
    // Shape: cut highs, keep warm mid-low
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 800;
    lp.Q.value = 0.3;
    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 80;
    hp.Q.value = 0.3;
    src.connect(hp);
    hp.connect(lp);

    // Slow LFO for wave rhythm
    var lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.1; // ~10s wave cycle
    var lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.15; // moderate swell
    lfo.connect(lfoGain);

    var vca = ctx.createGain();
    vca.gain.value = 0.55;
    lfoGain.connect(vca.gain);
    lp.connect(vca);

    var origStart = src.start.bind(src);
    src.start = function() { origStart(); lfo.start(); };
    var origStop = src.stop.bind(src);
    src.stop = function() { origStop(); try { lfo.stop(); } catch(e){} };

    return { source: src, output: vca };
  }

  const AMBIENTS = {
    off:    { label: 'Off',    gen: null },
    forest: { label: 'Forest', gen: makeForest },
    rain:   { label: 'Rain',   gen: makeRain },
    ocean:  { label: 'Ocean',  gen: makeOcean },
  };

  // -- Elements --

  // -- localStorage helpers --
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function yesterdayStr() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // -- Settings memory --
  function saveSettings() {
    const s = { timerMin, wave: currentWave, ambient: currentAmbient };
    try { localStorage.setItem('focustimer_settings', JSON.stringify(s)); } catch(e) {}
  }

  function loadSettings() {
    try {
      const raw = localStorage.getItem('focustimer_settings');
      if (!raw) return;
      const s = JSON.parse(raw);
      if (s.timerMin >= 1 && s.timerMin <= 180) timerMin = s.timerMin;
      if (WAVES[s.wave]) currentWave = s.wave;
      if (AMBIENTS[s.ambient]) currentAmbient = s.ambient;
    } catch(e) {}
  }

  // -- Daily record --
  function getDaily() {
    try {
      const raw = localStorage.getItem('focustimer_daily');
      if (!raw) return null;
      return JSON.parse(raw);
    } catch(e) { return null; }
  }

  function initDaily() {
    let d = getDaily();
    const today = todayStr();
    if (!d || d.date !== today) {
      d = { date: today, rounds: 0, focusMin: 0 };
      try { localStorage.setItem('focustimer_daily', JSON.stringify(d)); } catch(e) {}
    }
    return d;
  }

  function updateDaily(addRounds, addFocusMin) {
    let d = initDaily();
    d.rounds += addRounds;
    d.focusMin += addFocusMin;
    try { localStorage.setItem('focustimer_daily', JSON.stringify(d)); } catch(e) {}
    renderDaily();
  }

  function renderDaily() {
    const d = initDaily();
    dailyTxt.textContent = 'Today: ' + d.rounds + ' rounds \u00b7 ' + d.focusMin + ' min focused';
  }

  // -- Streak --
  function getStreak() {
    try {
      const raw = localStorage.getItem('focustimer_streak');
      if (!raw) return { lastDate: '', count: 0 };
      return JSON.parse(raw);
    } catch(e) { return { lastDate: '', count: 0 }; }
  }

  function updateStreak() {
    const today = todayStr();
    const yesterday = yesterdayStr();
    let s = getStreak();
    if (s.lastDate === today) return;
    if (s.lastDate === yesterday) {
      s.count++;
    } else {
      s.count = 1;
    }
    s.lastDate = today;
    try { localStorage.setItem('focustimer_streak', JSON.stringify(s)); } catch(e) {}
    renderStreak();
  }

  function renderStreak() {
    const s = getStreak();
    if (s.count >= 2) {
      streakBadge.textContent = '\ud83d\udd25 ' + s.count + ' days';
      streakBadge.style.display = '';
    } else {
      streakBadge.style.display = 'none';
    }
  }

  // -- Display helpers --
  function fmtTime(totalSec) {
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return String(m).padStart(2,'0') + '<span class="t-colon">:</span>' + String(s).padStart(2,'0');
  }

  function updateDisp() {
    if (isRunning) {
      dispNum.innerHTML = fmtTime(remaining);
    } else {
      dispNum.innerHTML = String(timerMin).padStart(2,'0') + '<span class="t-colon">:</span>00';
    }
  }

  function setPhase(text, color) {
    phaseTxt.textContent = text;
    circlePhase.textContent = text;
    if (color) {
      phasePip.style.background = color;
      phasePip.style.boxShadow = '0 0 6px ' + color;
      phasePip.classList.add('visible');
    } else {
      phasePip.classList.remove('visible');
    }
  }

  function updateRnd() {
    rndEl.textContent = rounds + ' rnd \u00b7 ' + pts + ' pts';
  }


  // -- Circular progress --
  const CIRCLE_R = 108;
  const CIRCLE_C = 2 * Math.PI * CIRCLE_R; // ~678.58

  function updateCircleProgress() {
    if (!isRunning || totalPhaseTime <= 0) {
      circleFg.setAttribute('stroke-dasharray', '0 ' + CIRCLE_C);
      return;
    }
    const progress = 1 - (remaining / totalPhaseTime);
    const dash = progress * CIRCLE_C;
    circleFg.setAttribute('stroke-dasharray', dash + ' ' + CIRCLE_C);
    circleFg.style.stroke = 'var(--accent)';
  }

  // -- Immersive mode (panels collapse when running) --
  function enterImmersive() {
    collapsibles.forEach(function(el) { el.classList.add('hidden'); });
    timerSection.classList.add('immersive');
  }

  function exitImmersive() {
    collapsibles.forEach(function(el) { el.classList.remove('hidden'); });
    timerSection.classList.remove('immersive');
  }

  // -- Mode switching --
  function setMode(med) {
    isMedMode = med;
    tabFocus.classList.toggle('on', !med);
    tabFocus.setAttribute('aria-selected', String(!med));
    tabMed.classList.toggle('on', med);
    tabMed.setAttribute('aria-selected', String(med));

    if (med) {
      timerEyebrow.textContent = 'Session Duration';
      document.body.classList.add('cm');
      document.body.classList.remove('cf','cb');
      breathRing.classList.add('active');
    } else {
      timerEyebrow.textContent = 'Work Duration';
      document.body.classList.remove('cm');
      breathRing.classList.remove('active');
    }

    if (!isRunning) {
      timerMin = med ? 15 : 25;
      updateDisp();
      saveSettings();
    }
  }

  tabFocus.addEventListener('click', function() { if (isRunning) return; setMode(false); });
  tabMed.addEventListener('click', function() { if (isRunning) return; setMode(true); });

  // -- Drag / scroll for main timer --
  let dragStartY = null;
  let dragBase = null;
  const STEP_PX = 8;
  const STEP_TOUCH = 7;

  function clampMin(val) {
    return Math.max(1, Math.min(180, val));
  }

  mainTrack.addEventListener('wheel', function(e) {
    if (isRunning) return;
    e.preventDefault();
    const delta = e.deltaY > 0 ? -1 : 1;
    timerMin = clampMin(timerMin + delta);
    updateDisp();
    saveSettings();
  }, { passive: false });

  mainTrack.addEventListener('mousedown', function(e) {
    if (isRunning) return;
    dragStartY = e.clientY;
    dragBase = timerMin;
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
  });

  function onMouseMove(e) {
    const dy = dragStartY - e.clientY;
    const steps = Math.round(dy / STEP_PX);
    timerMin = clampMin(dragBase + steps);
    updateDisp();
  }

  function onMouseUp() {
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
    saveSettings();
  }

  mainTrack.addEventListener('touchstart', function(e) {
    if (isRunning) return;
    dragStartY = e.touches[0].clientY;
    dragBase = timerMin;
  }, { passive: true });

  mainTrack.addEventListener('touchmove', function(e) {
    if (isRunning) return;
    const dy = dragStartY - e.touches[0].clientY;
    const steps = Math.round(dy / STEP_TOUCH);
    timerMin = clampMin(dragBase + steps);
    updateDisp();
  }, { passive: true });

  mainTrack.addEventListener('touchend', function() {
    saveSettings();
  }, { passive: true });


  // -- Audio --
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function startWaves() {
    initAudio();
    stopWaves();
    const w = WAVES[currentWave];
    gainNode = audioCtx.createGain();
    gainNode.gain.value = muted ? 0 : 0.04;

    const merger = audioCtx.createChannelMerger(2);
    merger.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscLeft = audioCtx.createOscillator();
    oscLeft.type = 'sine';
    oscLeft.frequency.value = w.carrier;

    oscRight = audioCtx.createOscillator();
    oscRight.type = 'sine';
    oscRight.frequency.value = w.carrier + w.beat;

    const panL = audioCtx.createStereoPanner();
    panL.pan.value = -1;
    const panR = audioCtx.createStereoPanner();
    panR.pan.value = 1;

    oscLeft.connect(panL).connect(merger, 0, 0);
    oscRight.connect(panR).connect(merger, 0, 1);

    oscLeft.start();
    oscRight.start();

    waveDot.classList.add('active');
    var wClass = currentWave;
    if (wClass === 'beta') {
      waveDot.style.background = 'var(--accent)';
      waveDot.style.boxShadow = '0 0 5px var(--accent)';
    } else if (wClass === 'alpha') {
      waveDot.style.background = 'var(--alpha)';
      waveDot.style.boxShadow = '0 0 5px var(--alpha)';
    } else {
      waveDot.style.background = 'var(--theta)';
      waveDot.style.boxShadow = '0 0 5px var(--theta)';
    }
    waveTxt.textContent = w.name;
    circleWaveInfo.textContent = w.name;
  }

  function stopWaves() {
    if (oscLeft) { try { oscLeft.stop(); } catch(e) {} oscLeft = null; }
    if (oscRight) { try { oscRight.stop(); } catch(e) {} oscRight = null; }
    if (gainNode) { gainNode = null; }
    waveDot.classList.remove('active');
    waveDot.style.background = '';
    waveDot.style.boxShadow = '';
    waveTxt.textContent = 'Waves off';
  }

  // -- Ambient sound --
  function startAmbient() {
    // Stop previous immediately (no fade) to avoid race condition
    if (ambientSource) {
      try { ambientSource.stop(); } catch(e) {}
      ambientSource = null;
      ambientGain = null;
    }
    if (currentAmbient === 'off') return;
    initAudio();
    const gen = AMBIENTS[currentAmbient].gen;
    const result = gen(audioCtx);

    ambientGain = audioCtx.createGain();
    ambientGain.gain.setValueAtTime(0, audioCtx.currentTime);
    ambientGain.gain.linearRampToValueAtTime(muted ? 0 : 0.35, audioCtx.currentTime + 0.8);
    result.output.connect(ambientGain);
    ambientGain.connect(audioCtx.destination);

    ambientSource = result.source;
    ambientSource.start();
  }

  function stopAmbient() {
    if (ambientSource) {
      if (ambientGain && audioCtx) {
        // Capture refs before nulling, so fade-out acts on the correct nodes
        var src = ambientSource;
        var gn = ambientGain;
        ambientSource = null;
        ambientGain = null;
        try {
          gn.gain.cancelScheduledValues(audioCtx.currentTime);
          gn.gain.setValueAtTime(gn.gain.value, audioCtx.currentTime);
          gn.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
          setTimeout(function() {
            try { src.stop(); } catch(e) {}
          }, 900);
        } catch(e) {
          try { src.stop(); } catch(e2) {}
        }
        return;
      }
      try { ambientSource.stop(); } catch(e) {}
      ambientSource = null;
      ambientGain = null;
    }
  }

  function selectAmbient(id) {
    currentAmbient = id;
    Object.keys(ambBtns).forEach(function(k) {
      ambBtns[k].classList.toggle('on', k === id);
    });
    if (isRunning) {
      startAmbient();
    }
    saveSettings();
  }

  ambBtns.off.addEventListener('click', function() { selectAmbient('off'); });
  ambBtns.forest.addEventListener('click', function() { selectAmbient('forest'); });
  ambBtns.rain.addEventListener('click', function() { selectAmbient('rain'); });
  ambBtns.ocean.addEventListener('click', function() { selectAmbient('ocean'); });

  // -- Wave buttons --
  function selectWave(id) {
    currentWave = id;
    [waveB, waveA, waveTheta].forEach(function(btn) {
      btn.classList.remove('on');
      btn.setAttribute('aria-pressed', 'false');
    });
    var map = { beta: waveB, alpha: waveA, theta: waveTheta };
    map[id].classList.add('on');
    map[id].setAttribute('aria-pressed', 'true');
    if (isRunning && !muted) {
      startWaves();
    }
    saveSettings();
  }

  waveB.addEventListener('click', function() { selectWave('beta'); });
  waveA.addEventListener('click', function() { selectWave('alpha'); });
  waveTheta.addEventListener('click', function() { selectWave('theta'); });

  // -- Mute --
  muteBtn.addEventListener('click', function() {
    muted = !muted;
    muteBtn.textContent = muted ? '\ud83d\udd15' : '\ud83d\udd14';
    muteBtn.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
    if (gainNode) {
      gainNode.gain.setTargetAtTime(muted ? 0 : 0.04, audioCtx.currentTime, 0.05);
    }
    if (ambientGain) {
      ambientGain.gain.setTargetAtTime(muted ? 0 : 0.35, audioCtx.currentTime, 0.05);
    }
  });

  // -- Wake Lock --
  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
    }
  }

  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  }

  // -- Background phase tint --
  function setBodyPhase() {
    document.body.classList.remove('cf','cm');
    if (isMedMode) {
      document.body.classList.add('cm');
    } else if (isRunning) {
      document.body.classList.add('cf');
    }
  }

  // -- Timer logic --
  function startTimer() {
    remaining = timerMin * 60;
    totalPhaseTime = remaining;
    isRunning = true;

    btnStart.textContent = 'Pause';
    btnStop.classList.add('visible');
    hintEl.style.opacity = '0';

    enterImmersive();

    if (isMedMode) {
      setPhase('Meditating', 'var(--alpha)');
      breathRing.classList.add('active');
    } else {
      setPhase('Focus', 'var(--accent)');
    }

    setBodyPhase();
    requestWakeLock();
    if (!muted) {
      startWaves();
      startAmbient();
    } else if (currentAmbient !== 'off') {
      startAmbient();
    }

    updateCircleProgress();
    intervalId = setInterval(tick, 1000);
  }

  function pauseTimer() {
    clearInterval(intervalId);
    intervalId = null;
    btnStart.textContent = 'Resume';
    setPhase('Paused', 'rgba(255,255,255,0.35)');
  }

  function resumeTimer() {
    btnStart.textContent = 'Pause';
    if (isMedMode) {
      setPhase('Meditating', 'var(--alpha)');
    } else {
      setPhase('Focus', 'var(--accent)');
    }
    intervalId = setInterval(tick, 1000);
  }

  function stopTimer() {
    clearInterval(intervalId);
    intervalId = null;
    isRunning = false;
    totalPhaseTime = 0;
    stopWaves();
    stopAmbient();
    releaseWakeLock();
    breathRing.classList.remove('active');

    exitImmersive();

    btnStart.textContent = 'Start';
    btnStop.classList.remove('visible');
    hintEl.style.opacity = '1';
    setPhase('Ready', null);
    setBodyPhase();
    updateDisp();
    updateCircleProgress();
    circleWaveInfo.textContent = '';
  }

  function tick() {
    if (remaining <= 0) {
      onPhaseEnd();
      return;
    }
    remaining--;
    updateDisp();
    updateCircleProgress();

    // pulse timer number on last 10s
    if (remaining <= 10 && remaining > 0) {
      dispNum.style.color = 'var(--accent)';
    } else {
      dispNum.style.color = '';
    }
  }

  function playNotification() {
    initAudio();
    var ctx = audioCtx;
    var now = ctx.currentTime;

    // Soft chime - two gentle tones
    [660, 880].forEach(function(freq, i) {
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.connect(g);
      g.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      var t = now + i * 0.3;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.25, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
      osc.start(t);
      osc.stop(t + 1.2);
    });

    if (navigator.vibrate) {
      navigator.vibrate([200, 100, 200]);
    }
  }

  function onPhaseEnd() {
    clearInterval(intervalId);
    intervalId = null;

    rounds++;
    pts += timerMin;
    updateRnd();
    updateDaily(1, timerMin);

    var d = getDaily();
    if (d && d.rounds === 1) {
      updateStreak();
    }

    playNotification();
    stopTimer();
    setPhase(isMedMode ? 'Session complete' : 'Focus complete', null);
  }

  function selectWaveAudio(id) {
    currentWave = id;
    if (isRunning && !muted) startWaves();
  }

  // -- Btn Start: Start → Pause → Resume cycle --
  btnStart.addEventListener('click', function() {
    if (!isRunning) {
      startTimer();
    } else if (intervalId) {
      pauseTimer();
    } else {
      // Paused → resume
      resumeTimer();
    }
  });

  // -- Btn Stop: simple stop & reset --
  btnStop.addEventListener('click', function() {
    if (!isRunning) return;
    stopTimer();
  });

  // -- Init --
  loadSettings();

  // Apply saved wave selection
  selectWave(currentWave);

  // Apply saved ambient selection
  Object.keys(ambBtns).forEach(function(k) {
    ambBtns[k].classList.toggle('on', k === currentAmbient);
  });

  updateDisp();
  updateRnd();
  setPhase('Ready', null);
  renderDaily();
  renderStreak();
  updateCircleProgress();

  // Ensure hint visible on start
  hintEl.style.opacity = '1';

})();
</script>
</body>
</html>
